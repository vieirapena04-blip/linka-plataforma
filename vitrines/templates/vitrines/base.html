<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linka | Vitrines de afiliados</title><style>:root{--ink:#222;--sub:#6a6a6a;--red:#ff385c;--pale:#fff6f7;--line:#e7e7e7}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:var(--ink);margin:0;background:#fff}header{padding:15px 6%;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.logo{font-size:25px;font-weight:bold;color:var(--red);text-decoration:none}.nav{display:flex;gap:15px;flex:1}.nav a{font-size:14px;font-weight:bold;text-decoration:none;color:#333}.nav a:hover{color:var(--red)}main{max-width:1160px;margin:0 auto;padding:36px 22px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px}.btn{display:inline-block;background:var(--red);color:#fff;padding:12px 16px;text-decoration:none;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.secondary{background:#fff;color:#222;border:1px solid #bbb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.product{overflow:hidden;padding:0}.product img,.placeholder{height:160px;width:100%;object-fit:cover;background:linear-gradient(135deg,#ffc1cd,#ffe19e)}.product .body{padding:16px}.muted{color:var(--sub);line-height:1.55}.search{display:flex;gap:8px;max-width:600px;margin:22px 0}.search input{flex:1}input,select,textarea{width:100%;padding:12px;border:1px solid #c9c9c9;border-radius:8px}label{display:block;font-weight:bold;font-size:13px;margin:14px 0 6px}form p{line-height:1.4}.hero{padding:54px;border-radius:24px;background:linear-gradient(120deg,#fff0f3,#fff);margin-bottom:30px}.hero h1{font-size:clamp(36px,6vw,65px);letter-spacing:-2px;line-height:.98;margin:10px 0}.tag{color:#c81d3d;font-weight:bold;font-size:12px;letter-spacing:.1em}footer{border-top:1px solid var(--line);padding:28px 6%;color:var(--sub);font-size:13px}@media(max-width:760px){header{padding:14px 18px}.nav{display:none}main{padding:26px 18px}.hero{padding:30px}}</style></head><body><header><a class="logo" href="{% url 'home' %}">linka</a><nav class="nav"><a href="{% url 'home' %}">Explorar</a><a href="{% url 'vitrines' %}">Vitrines</a><a href="{% url 'como_funciona' %}">Como funciona</a><a href="{% url 'suporte' %}">Suporte</a></nav>{% if user.is_authenticated %}<a class="btn" href="{% url 'dashboard' %}">Meu painel</a>{% else %}<a class="btn" href="{% url 'login' %}">Entrar</a>{% endif %}</header><main>{% block content %}{% endblock %}</main><footer>Linka · A plataforma organiza vitrines e redireciona para parceiros. <a href="{% url 'termos' %}">Termos de uso</a></footer></body></html>
